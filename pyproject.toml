[project]
name = "demo-fast-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "dotenv>=0.9.9",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "psycopg2>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
start = "demo_fast_api:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
